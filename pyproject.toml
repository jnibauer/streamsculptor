[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsculptor"
version = "0.1.0"
description = "JAX-based library for modeling stellar streams in galactic potentials"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jacob Nibauer", email = "jn5830@princeton.edu" }]
keywords = ["astronomy", "astrophysics", "stellar-streams", "jax", "galactic-dynamics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
]

# CPU install by default: `pip install streamsculptor` pulls the CPU build of jax.
# jax and the jax-coupled libraries are pinned exactly (they break across jax
# versions); the rest are floored at the tested env versions.
dependencies = [
  "jax==0.4.38",
  "diffrax==0.7.0",
  "equinox==0.11.11",
  "interpax==0.3.4",
  "astropy>=7.0.0",
  "jaxopt>=0.8.3",
  "numpy>=2.1.3",
  "optax>=0.2.4",
  "quadax>=0.2.8",
  "tqdm>=4.67.1",
]

[project.optional-dependencies]
# GPU (CUDA 12): pip install "streamsculptor[gpu]"
gpu = ["jax[cuda12]==0.4.38"]
# AGAMA potential interpolation: pip install "streamsculptor[agama]"
agama = ["agama>=1.0"]
# SIDM / gala-based unit-system helpers: pip install "streamsculptor[gala]"
gala = ["gala>=1.9"]
# NOTE: basis function expansion potentials (bfeax) are installed separately,
# since PyPI does not allow git URL dependencies in package metadata:
#   pip install "git+https://github.com/jnibauer/bfeax.git"

[project.urls]
Homepage = "https://github.com/jnibauer/streamsculptor"
Repository = "https://github.com/jnibauer/streamsculptor"

[tool.setuptools.packages.find]
include = ["streamsculptor*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Include non-.py files inside the installed package.
streamsculptor = [
  "data/LMC_MW_potential/*",
  "data/GD1_prog/*",
  "data/sidm/*",
  "examples/*",
]
